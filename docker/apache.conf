# The docs site's Apache settings. Pretty links without .htaccess, the site's
# files at /images/, and 404 for everything that edits or signs in, as the
# host's nginx also does.
ServerName themes.andrew.cmu.edu
ServerTokens Prod
ServerSignature Off

<Directory /var/www/html>
	AllowOverride None
	Options -Indexes
	RewriteEngine On
	RewriteBase /
	RewriteCond %{QUERY_STRING} (^|&)rest_route= [NC]
	RewriteRule ^ - [R=404,L]
	RewriteRule ^index\.php$ - [L]
	RewriteCond %{REQUEST_FILENAME} !-f
	RewriteCond %{REQUEST_FILENAME} !-d
	RewriteRule . /index.php [L]
</Directory>

# No PHP runs from the media library or the SQLite plugin's folder
<Directory /var/www/html/wp-content/uploads>
	<FilesMatch "\.php$">
		Require all denied
	</FilesMatch>
</Directory>
<Directory /var/www/html/wp-content/sqlite-database-integration>
	Require all denied
</Directory>

RedirectMatch 404 ^/(wp-admin|wp-json)(/|$)
RedirectMatch 404 ^/(wp-login|xmlrpc|wp-cron|wp-signup|wp-activate|wp-trackback|wp-links-opml|wp-mail|wp-comments-post|wp-config)\.php$
RedirectMatch 404 ^/(readme\.html|license\.txt|wp-config-sample\.php)$
# Only index.php runs; no file under wp-content or wp-includes is a page
RedirectMatch 404 ^/wp-(content|includes)/.*\.php$

Alias /images/ /opt/fam/images/
<Directory /opt/fam/images>
	Options -Indexes
	AllowOverride None
	Require all granted
</Directory>
