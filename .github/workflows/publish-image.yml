# Builds the docs site's image (Dockerfile) on every run and pushes it to
# ghcr.io/cmu-web/cmu-web-forbes-and-moreword for releases (version tags or a
# manual run). A deployment pins it by digest.
name: Publish Image

on:
  push:
    branches: ["0.x"]
    tags: ["[0-9]*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: env.RELEASE == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/cmu-web/cmu-web-forbes-and-moreword
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=sha
            type=semver,pattern={{version}}
      # No build cache: the seed step imports PlaceMellon photos, and a
      # cached layer would keep an old build of the site
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: production
          platforms: linux/amd64
          push: ${{ env.RELEASE == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: true
          load: true
      # The built site answers, and nothing that edits or signs in does
      - name: Check the image
        run: |
          image=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          docker run -d --name fam --read-only --tmpfs /tmp --cap-drop=ALL \
            --security-opt no-new-privileges -p 127.0.0.1:8080:8080 \
            -e FAM_URL=http://127.0.0.1:8080 "$image"
          sh docker/check.sh http://127.0.0.1:8080
