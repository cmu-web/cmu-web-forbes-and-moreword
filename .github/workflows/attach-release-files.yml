# Zips the theme and attaches forbes-and-moreword.zip to the tag's GitHub
# release. The tag has to match Version: in the theme's style.css.
name: Attach Release Files

on:
  push:
    tags: ["[0-9]*"]

permissions:
  contents: read

jobs:
  theme:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the version
        run: |
          version=$(sed -n 's/^Version: *//p' forbes-and-moreword/style.css)
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "style.css says $version, but the tag is $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - run: zip -r forbes-and-moreword.zip forbes-and-moreword
      # A person makes the release, with its notes; this waits for it (up to
      # 30 minutes) and attaches the files
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break
            sleep 30
          done
          gh release upload "$GITHUB_REF_NAME" forbes-and-moreword.zip --clobber
